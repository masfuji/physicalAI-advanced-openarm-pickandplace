nodes:
  - id: ui
    build: |
      pip install git+https://github.com/enactic/dora-openarm-data-collection-ui
      pip install -e ..
    path: dora-openarm-vr-collection-ui
    env:
      METADATA_FILE: "pick_place_metadata.yaml"
      PYTHONUTF8: "1"
    inputs:
      tick: dora/timer/secs/1
      button_a:
        source: udp-receiver/button_a
        queue_size: 100
      button_b:
        source: udp-receiver/button_b
        queue_size: 100
    outputs:
      - command
      - randomize
  - id: reset-button
    build: pip install -e ..
    path: dora-openarm-reset-button
    inputs:
      button_x: udp-receiver/button_x
      randomize: ui/randomize
    outputs:
      - button_x
  - id: quittable-tick-leader
    build: pip install git+https://github.com/enactic/dora-openarm-quitter.git
    path: dora-openarm-quitter
    inputs:
      tick: dora/timer/millis/2
      command: ui/command
    outputs:
      - tick
  - id: udp-receiver
    build: pip install -e ..
    path: dora-openarm-quest-receiver
    args: "--host 0.0.0.0 --port 5006"
    inputs:
      tick: quittable-tick-leader/tick
    outputs:
      - pose_right
      - trigger_right
      - grip_right
      - pose_left
      - pose_reference
      - trigger_left
      - grip_left
      - joystick_x_left
      - joystick_y_left
      - joystick_x_right
      - joystick_y_right
      - button_a
      - button_b
      - button_x
      - button_y
      - status
  - id: ik
    build: pip install git+https://github.com/enactic/dora-openarm-kinematics
    path: dora-openarm-ik
    args: "--mode bimanual --max-iters 10 --dt 0.1 --damping 0.1 --posture-cost 0.01 --lm-damping 0.01"
    inputs:
      tick: quittable-tick-leader/tick
      target_right: udp-receiver/pose_right
      target_left:  udp-receiver/pose_left
      trigger_right: udp-receiver/trigger_right
      trigger_left:  udp-receiver/trigger_left
    outputs:
      - position_left
      - position_right
      - status
  # ── MuJoCo viewer: pick and place scene (orange cube + black frame) with physics enabled ──
  - id: mujoco-collect
    build: pip install "dora-openarm-mujoco>=0.5.0"
    path: dora-openarm-mujoco
    # button_x re-randomizes the cube: xy offset within +-0.05 m and yaw
    args: "--xml scenes/pick_place.xml --randomize-objects 0.05 --keyframe home --enable-collision --ctrl --render --viewer --debug-frames"
    env:
      PYTHONUTF8: "1"
    inputs:
      move_position_left:  ik/position_left
      move_position_right: ik/position_right
      request_state: quittable-tick-leader/tick
      pose_right:     udp-receiver/pose_right
      pose_left:      udp-receiver/pose_left
      joystick_y:     udp-receiver/joystick_y_left
      button_x:
        source: reset-button/button_x
        queue_size: 100
    outputs:
      - status
      - state_right            # replaces follower-right/state
      - state_left             # replaces follower-left/state
      - camera_wrist_right      # replaces camera-wrist-right/image
      - camera_wrist_left       # replaces camera-wrist-left/image
      - camera_head_left
      - camera_head_right
      - camera_ceiling          # replaces camera-ceiling/image
  - id: ceiling-camera-viewer
    build: pip install -e ..
    path: dora-openarm-camera-viewer
    args: "--title Ceiling"
    inputs:
      image:
        source: mujoco-collect/camera_ceiling
        queue_size: 1
  - id: recorder
    build: pip install git+https://github.com/enactic/dora-openarm-dataset-recorder
    path: dora-openarm-dataset-recorder
    env:
      METADATA_FILE: "pick_place_metadata.yaml"
      DIRECTORY: "data/pick_place_cube_right"
      PYTHONUTF8: "1"
    inputs:
      command:               ui/command
      arm_right_action:      ik/position_right
      arm_right_observation: mujoco-collect/state_right
      arm_left_action:       ik/position_left
      arm_left_observation:  mujoco-collect/state_left
      camera_wrist_right:    mujoco-collect/camera_wrist_right
      camera_wrist_left:     mujoco-collect/camera_wrist_left
      camera_head_left:      mujoco-collect/camera_head_left
      camera_head_right:     mujoco-collect/camera_head_right
      camera_ceiling:        mujoco-collect/camera_ceiling
